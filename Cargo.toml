[package]
name = "nub"
version = "0.0.54"
edition = "2021"
description = "A control plane for one container host."
license = "MIT OR Apache-2.0"

[[bin]]
name = "nub"
path = "src/main.rs"

[features]
default = []
embed-ui = ["dep:rust-embed", "dep:mime_guess", "dep:qrcode"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "sync"] }
axum = { version = "0.7", features = ["ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
base64 = "0.22"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
rust-embed = { version = "8", features = ["compression"], optional = true }
mime_guess = { version = "2", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "smallvec", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
age = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
